<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sa3dny - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/stylee.css">
</head>
<body>
    <nav class="navbar">
        <div class="back"><button class="back-btn" onclick="history.back()">back</button></div>
        <div class="nav-logo"><img src="../images/logo white.PNG" alt="Sa3dny"></div>
        <ul class="nav-links">
            <li><a href="#">Services</a></li> |
            <li><a href="register.html">Sign up</a></li> |
            <li><a href="login.html">Log in</a></li>
            <li><a href="become-provider.html" class="provider-btn">Become a Provider</a></li>
        </ul>
    </nav>

    <div class="background"></div>

    <div class="main-content">
        <div class="hero-wrap">

            <div class="services-orbit">
                <a class="service-bubble pos-left-top" href="#" onclick="openServiceForm('Cleaning')">
                    <div class="bubble-face">
                        <img src="../images/icons/cleaning (3).png" class="bubble-icon-img" alt="Cleaning">
                    </div>
                    <span class="service-label">Cleaning</span>
                </a>

                <a class="service-bubble pos-left-mid" href="#" onclick="openServiceForm('Plumbing');">
                    <img src="../images/icons/piumbing.png" class="bubble-icon-img" alt="Plumbing">
                </a>

                <a class="service-bubble pos-left-bot" href="#" onclick="openServiceForm('Carpenter');">
                    <img src="../images/icons/carpenter_transparent.png" class="bubble-icon-img" alt="Carpenter">
                </a>

                <a class="service-bubble pos-right-top" href="#" onclick="openServiceForm('injection');">
                    <img src="../images/icons/injection.png" class="bubble-icon-img" alt="Injection">
                </a>

                <a class="service-bubble pos-right-mid" href="#" onclick="openServiceForm('Nursing');">
                    <img src="../images/icons/nursing.png" class="bubble-icon-img" alt="Nursing">
                </a>

                <a class="service-bubble pos-right-bot" href="#" onclick="openServiceForm('presentation');">
                    <img src="../images/icons/presentation.png" class="bubble-icon-img" alt="Presentation">
                </a>
            </div>

            <div class="card">
                <div class="logo">
                    <img src="../images/logo white.PNG" alt="Sa3dny Logo" class="logo">
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Email Address" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                    </div>

                    <div class="form-options">
                        <a href="forgot-password.html" class="forgot">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn">Log in</button>
                </form>

                <div class="signup">
                    Don’t have an account? <a href="register.html">Sign up</a>
                </div>
            </div>

        </div>
    </div>

    <button class="chat">Help?</button>

    <footer class="footer">
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Use</a>
            <a href="#">Contact</a>
        </div>
    </footer>

    <script src="../script/auth.js"></script>
</body>
</html>
