<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sa3dny - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/register.css">
</head>
<body>
    <nav class="navbar">
        <div class="back"><button class="back-btn" onclick="history.back()">back</button></div>
        <div class="nav-logo"><img src="../images/logo white.PNG" alt="Sa3dny"></div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li> |
            <li><a href="register.html">Sign up</a></li> |
            <li><a href="login.html">Log in</a></li>
            <li><a href="become-provider.html" class="provider-btn">Become a Provider</a></li>
        </ul>
    </nav>

    <div class="background"></div>

    <main class="wrapper">
        <section class="card">
            <div class="brand"><img src="../images/logo white.PNG" alt="Sa3dny" class="brand-logo"></div>

            <form class="form" id="registerForm">
                <div class="field">
                    <input type="text" id="regFullName" placeholder="Full Name" required>
                </div>

                <div class="field">
                    <input type="tel" id="regPhone" placeholder="Phone" required>
                </div>

                <div class="field">
                    <select id="regLocation" required>
                        <option value="" disabled selected>Your Location In Assuit</option>
                        <option value="Ferial">Ferial</option>
                        <option value="Mousna3 Sayed">Masnaa Sayed</option>
                        <option value="Governorate Street">Governorate Street</option>
                        <option value="Libraries">Libraries Area</option>
                        <option value="Asmaa Allah Square">Asmaa Allah Al-Husna Square</option>
                        <option value="Station">The Station</option>
                        <option value="Fateh">Al-Fateh</option>
                        <option value="Hamraa">Al-Hamraa</option>
                    </select>
                </div>

                <div class="field">
                    <input type="email" id="regEmail" placeholder="Email" required>
                </div>

                <div class="field pass">
                    <input type="password" id="regPassword" placeholder="Password" required>
                    <button type="button" class="eye">👁</button>
                </div>

                <div class="field pass">
                    <input type="password" id="regConfirmPassword" placeholder="Password Confirmation" required>
                    <button type="button" class="eye">👁</button>
                </div>

                <button type="submit" class="btn">Register</button>

                <p class="bottom">
                    Already have an account? <a href="login.html" class="login">Login</a>
                </p>
            </form>
        </section>
    </main>

    <script src="../script/auth.js"></script>
</body>
</html>
